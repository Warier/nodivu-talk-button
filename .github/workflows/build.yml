name: Build and test plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-package
          path: dist/*.zip
